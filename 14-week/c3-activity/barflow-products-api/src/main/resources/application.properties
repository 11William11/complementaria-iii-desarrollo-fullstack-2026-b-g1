spring.application.name=barflow-products-api
server.port=8080

# Base de datos en memoria: se crea al arrancar y se borra al detener
spring.datasource.url=jdbc:h2:mem:barflow
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Productos de ejemplo al arrancar (ver config/SampleDataLoader)
barflow.sample-data=true

# Seguridad (semana 11): usuario de prueba y firma del JWT.
# Valores de demostración: en producción vendrían de variables de entorno.
barflow.auth.username=admin
barflow.auth.password=barflow123
barflow.jwt.secret=YmFyZmxvdy1kZW1vLXNlY3JldC1rZXktZm9yLWp3dC1obWFjLXNoYTI1Ni0yMDI2
barflow.jwt.expiration-minutes=60

# Frontend de la semana 12 (Live Server o npx serve en el puerto 5500)
barflow.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
