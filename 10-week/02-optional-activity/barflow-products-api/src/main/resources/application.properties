spring.application.name=barflow-products-api
server.port=8080

# Base de datos en memoria: se crea al arrancar y se borra al detener
spring.datasource.url=jdbc:h2:mem:barflow
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Productos de ejemplo al arrancar (ver config/SampleDataLoader)
barflow.sample-data=true
